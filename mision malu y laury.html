<style>

#vw{display:flex;flex-direction:column;padding:8px;gap:8px}
.tb,.bt{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.tb .sp{flex:1}

.bt .lb{font-weight:900;font-size:.72rem;text-transform:uppercase}
.ov{position:fixed;inset:0;background:#20203bcc;display:none;align-items:center;justify-content:center;padding:12px;z-index:9}.ov.open{display:flex}
.md{width:min(1120px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.mh{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:4px solid var(--ink);background:var(--y)}.mh h3{margin:0;flex:1;font-size:1rem}
.mb{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(220px,1fr);gap:12px;padding:12px;overflow:auto;min-height:0}.mb.big{grid-template-columns:1fr}.mb.big #inf{display:none}.mb.big #iw{max-height:74vh}
#iw{overflow:auto;background:#fff;border:3px solid var(--ink);max-height:60vh;min-height:200px}#im{display:block;width:100%}
#tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}#zc{display:flex;gap:6px;align-items:center;margin-bottom:6px}
#inf h4{margin:10px 0 4px;font-size:.8rem;text-transform:uppercase}#inf ul{margin:0;padding-left:18px}#inf p{margin:4px 0}
.nd{background:#fff3b0;border:3px dashed var(--ink);padding:8px;font-weight:700}.ft{font-size:.72rem;opacity:.75}
.md{height:min(92vh,840px)}
.mh{display:flex;gap:12px;align-items:center;padding:8px 14px;border-bottom:4px solid var(--ink);transition:background-color .5s}
.md[data-w=m] .mh{background:#ffc9de}.md[data-w=l] .mh{background:#d8c7ff}
#mp{width:100px;height:86px;object-fit:cover;border:3px solid var(--ink);image-rendering:pixelated;background:#fff9;flex:none}
.mn{flex:1;min-width:0}.mn b{display:inline-block;border:3px solid var(--ink);color:#fff;padding:0 10px;transition:background-color .5s}
.md[data-w=m] .mn b{background:#e0508c}.md[data-w=l] .mn b{background:#7954cc}
.mn h3{margin:4px 0 0;font-size:1.05rem}.mn small{opacity:.75}
.mb{flex:1;min-height:0;overflow:hidden}.mpl{display:flex;flex-direction:column;min-height:0;min-width:0}
#iw{flex:1;max-height:none;min-height:160px}#inf{overflow:auto;min-height:0}
.ex{padding:10px;border:3px solid var(--ink);line-height:1.45;font-weight:700;min-height:90px;transition:background-color .5s}
.md[data-w=m] .ex{background:#ffe3ee}.md[data-w=l] .ex{background:#ece3ff}
.mf{display:flex;gap:8px;justify-content:flex-end;padding:8px 12px;border-top:4px solid var(--ink);background:#faf8ff;flex-wrap:wrap}
@media(max-width:700px){.mb{grid-template-columns:1fr;overflow:auto}#iw{min-height:240px}}
@media(max-width:900px){body{overflow:auto}#app{height:auto;grid-template-columns:1fr}header{grid-column:1;flex-direction:column}.por{justify-content:center}#vw{order:2;height:78vh}#parts{order:3}#proj{order:4}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
/* ===== Mejoras de distribución, lectura de anotaciones e interacción ===== */
[hidden]{display:none!important}
.hint{margin:-4px 0 8px;font-size:.72rem;opacity:.75}
.md{width:min(1260px,100%);height:min(95vh,920px)}
.mb{grid-template-columns:minmax(0,1.55fr) minmax(290px,1fr);gap:10px;padding:10px}
#tabs{flex-wrap:nowrap;overflow-x:auto;padding:2px 2px 8px;margin-bottom:2px;scrollbar-width:thin}

.card{border:3px solid var(--ink);background:#faf8ff;padding:8px 10px;box-shadow:3px 3px 0 var(--ink)}.card p{margin:6px 0 0;line-height:1.45}

/* ===== Barra superior de la misión: menú, identificación, cinco estrellas y música ===== */
:root{--tbh:calc(54px + env(safe-area-inset-top,0px))}
#app{padding-top:calc(var(--tbh) + 10px)}
#top{position:fixed;left:0;right:0;top:0;height:var(--tbh);padding:env(safe-area-inset-top,0px) 10px 0;z-index:30;display:flex;align-items:center;gap:10px;background:#ece3ff;border-bottom:4px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
#top .pxb{min-height:34px;white-space:nowrap}
#mnu{background:var(--y);flex:none}
#ident{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
#ident .bs{display:flex;flex:none}
#ident .bs img{width:34px;height:30px;object-fit:cover;border:3px solid var(--ink);image-rendering:pixelated;background:#fff}
#ident .bs img+img{margin-left:-6px}
#ident .tt{min-width:0;line-height:1.1}
#ident .tt b{display:block;font:900 .92rem Nunito,system-ui,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#ident .tt small{display:block;font-size:.68rem;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stars{display:flex;align-items:center;gap:2px;flex:none;border:3px solid var(--ink);background:#fff;box-shadow:3px 3px 0 var(--ink);padding:1px 4px 1px 2px}
#stars .cnt{font:900 .72rem Nunito,system-ui,sans-serif;margin:0 2px 0 4px;white-space:nowrap}
.st{position:relative;width:32px;height:32px;padding:0;border:0;background:none;cursor:pointer;color:var(--ink)}
.st svg{position:absolute;left:1px;top:2px;width:30px;height:28px;display:block;shape-rendering:crispEdges}
.st .b .f{fill:#d3cce8}.st .b .o{fill:var(--ink)}.st .fl .f{fill:var(--y)}.st .fl .o{fill:transparent}
.st .fl{clip-path:inset(0 100% 0 0)}
.st.prog .fl{clip-path:inset(0 var(--rest,50%) 0 0)}
.st.done .fl{clip-path:inset(0 0 0 0)}
.st.done .b .f{fill:var(--y)}
.st.done svg{filter:drop-shadow(0 0 3px #ffd35a)}
.st i.n{position:absolute;right:-1px;bottom:-2px;font:900 .58rem Nunito,system-ui,sans-serif;font-style:normal;background:var(--ink);color:#fff;padding:0 3px;line-height:1.25}
.st.pop svg{animation:stpop .9s steps(9,end)}
.st.pop::after{content:"";position:absolute;inset:-4px;border:3px solid var(--y);animation:string .9s steps(6,end) forwards}
@keyframes stpop{0%{transform:scale(1)}30%{transform:scale(1.55) rotate(-14deg)}60%{transform:scale(.9) rotate(8deg)}100%{transform:scale(1)}}
@keyframes string{from{opacity:1;transform:scale(.6)}to{opacity:0;transform:scale(1.7)}}
.st:focus-visible,#mnu:focus-visible,#mus:focus-visible{outline:3px solid var(--pk);outline-offset:2px}
#mus[aria-pressed=true]{background:#c9f5a8}#mus[aria-pressed=false]{background:#e8e6f0}
#spn{position:fixed;right:10px;top:calc(var(--tbh) + 10px);width:min(400px,calc(100vw - 20px));max-height:calc(100vh - var(--tbh) - 24px);overflow:auto;z-index:25;padding:10px 12px;background:#fff;border:4px solid var(--ink);box-shadow:5px 5px 0 var(--ink)}
#spn h3{margin:0 0 6px;font:900 .95rem Nunito,system-ui,sans-serif;text-transform:uppercase}
#spn .it{display:grid;grid-template-columns:34px 1fr;gap:8px;padding:7px 0;border-top:2px dashed #cfc8e8}

#spn .it.lock .f{fill:#d3cce8}#spn .it.prog .f{fill:#ffe9a3}#spn .it.done .f{fill:var(--y)}#spn .o{fill:var(--ink)}

#toast{position:fixed;left:50%;top:calc(var(--tbh) + 14px);transform:translateX(-50%);z-index:35;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,460px)}
.tst{display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px;background:var(--y);border:4px solid var(--ink);box-shadow:5px 5px 0 var(--ink);font-weight:900;animation:tin .35s steps(5,end)}

const OK=['zapatas','columnas','vigas','nudos','losas','acero'],SPK=k=>OK.indexOf(k)%2===1?'l':'m',seen={};
const EXPL={"zapatas": "La zapata (o la placa de cimentación) es la base que reparte al terreno la carga de las columnas. En la planta, las cotas dan el largo y el ancho; en el corte, el espesor, el solado de limpieza y el recubrimiento del acero. El refuerzo se anota con cantidad, número de barra y separación: «5 #4» son 5 varillas número 4, y «8 #4 c/18», 8 varillas número 4 cada 18 cm. Si ves un cuadro de zapatas, cada fila relaciona un tipo (Z1, Z2…) con sus dimensiones y su armado en cada sentido. Pulsa «🔍 Cómo leer» para descifrar estos códigos.", "columnas": "Un despiece de columna dice cómo se distribuye su acero. Arriba va el tipo de columna (TIPO ①) y cuántas hay. A la izquierda están los niveles de piso (N±0.00, N+3.06…) y los flejes por zona: «6c/.10» son 6 flejes cada 10 cm, y «8c/.20», 8 flejes cada 20 cm en el centro. En el medio, cada barra se anota como «4#5 L=5.50»: 4 varillas del número 5 de 5,50 m. A la derecha está la sección: «58 FL #3 L=1.08» son 58 flejes del número 3 de 1,08 m, y «S=30x30» es el tamaño de la columna. Pulsa «🔍 Cómo leer» y toca cada dato.", "vigas": "Un despiece de viga muestra cómo se arma el acero antes de fundir el concreto. A la izquierda va el tipo de viga (VC-02) y su sección (25 × 25 cm); arriba, los ejes entre los que se ubica. Cada barra se lee «3#4 L=4.75»: 3 varillas del número 4 de 4,75 m; en verde el refuerzo superior y en azul el inferior. Los estribos se leen «10c/6»: 10 estribos cada 6 cm en los extremos, y «21c/13» en el centro. A la derecha, «41 FL #3 L=0.56» son 41 flejes del número 3 de 0,56 m. Pulsa «🔍 Cómo leer» para tocar cada dato.", "nudos": "El nudo es donde la viga se encuentra con la columna. Observa cómo las barras de la viga entran y se anclan dentro del nudo con ganchos, cómo continúa el refuerzo de la columna y dónde queda el primer fleje, muy cerca del borde. Los flejes del nudo se anotan igual que en columnas y vigas (por ejemplo «#3 c/10»). Un nudo bien confinado permite que el pórtico se deforme en un sismo sin romperse.", "losas": "En una planta, los ejes con sus cotas te dicen qué distancia cubre cada paño y las vigas aparecen con su nombre: así sabes cuál sostiene cada losa. Los cortes muestran el espesor y cómo la losa se apoya en las vigas. La malla se anota con diámetro y separación, por ejemplo «Ø 6.00 mm c/.15», y el recubrimiento con «Rec=.02» (2 cm). Las convenciones del plano explican cada sombreado y símbolo.", "acero": "El acero se nombra por número de barra (#3, #4, #5…): es el diámetro en octavos de pulgada. Se dibuja con ganchos y traslapos, y las tablas dan la longitud de traslapo y las dimensiones mínimas del gancho para cada diámetro. Una anotación como «5#8 5.05» dice 5 barras número 8 de 5,05 m, y «.35» es el doblez de 35 cm en el extremo. Los ganchos de 90°, 135° y 180° anclan el acero dentro del concreto.", "muros": "Los muros cierran el edificio, pero la carga principal la llevan los pórticos. En los planos, las columnetas y viguetas de confinamiento amarran esos muros y las juntas evitan que se agrieten."};
const DESC={"museo/nudo_junta_columnas": "Mira como se prepara la parte superior de una columna para fundir la viga en una segunda etapa. Se deja una superficie rugosa que mejora la adherencia entre ambos concretos.", "museo/viga_junta": "Este detalle muestra una junta de fundición con un corte inclinado a 45°. Cuando la viga se funde en dos partes, antes de continuar con la fundición de la segunda etapa, la primera se debe picar, limpiar y humedecer la superficie para favorecer la unión entre el concreto viejo y el nuevo.", "museo/nudo_interseccion_viga_columna": "Este detalle muestra cómo se conectan las vigas con la columna mediante el refuerzo de acero. Podemos observar las barras longitudinales y los flejes, que ayudan a confinar el concreto y mejorar la resistencia del nudo.", "museo/nudo_interno_externo": "Aquí comparamos dos tipos de nudos cuando se da la conexión viga - columna. El nudo interno tiene vigas que llegan por ambos lados de la columna, mientras que el externo se encuentra en el borde de la estructura, por lo que las vigas llegan solo por un lado. Esto cambia la disposición del refuerzo.", "museo/planta_localizacion_columnas": "Este plano corresponde a la localización de las columnas y los muros de contención del proyecto. Su función es mostrar la distribución y medidas de los elementos estructurales en planta", "museo/planta_tipificacion_columnas": "Este otro plano identifica los tipos de columnas y relaciona su ubicación con las especificaciones correspondientes.", "museo/columna_tipo1": "Un despiece es un plano que especifica cómo se distribuye el acero de refuerzo de un elemento estructural. En una columna de concreto reforzado el despiece permite identificar Los niveles entre los que se prolonga la columna. Las barras longitudinales y sus longitudes. La ubicación y separación de los flejes. La sección transversal y la distribución de las barras. Los cambios de armado en determinados tramos.", "museo/columna_tipo4": "Veamos como se lee el despiece y la sección de una columna tipo 4 En el despiece, 5#8 5.05 = 5 barras número 8, de 5,05 m de longitud, y .35 = doblez de 35 cm en sus extremos. 6#3 c/10, 10#3 c/10, 10#3 c/15 y 5#3 c/10 = cantidad de flejes número 3 y su separación: cada 10 o 15 cm cotas .65, 3.35 y .50 = longitudes de 65 cm, 3,35 m y 50 cm.", "museo/columna_tipo4_seccion": "En la sección 41#3 L=1.68 b=0.22 × h=0.52 = 41 flejes número 3, de 1,68 m de longitud y dimensiones de 22 × 52 cm. 82#3 L=0.43 h=0.23 = 82 piezas número 3, de 43 cm de longitud, con una dimensión indicada de 23 cm.", "museo/columna_dilatacion": "Aquí observamos la junta de dilatación alrededor de la columna, para permitir pequeños movimientos entre el piso y la columna sin que queden rígidamente unido", "museo/acero_traslapo_mallas": "Cuando en dos mallas de acero se superponen sus extremos para mantener la continuidad del refuerzo le llamamos traslapo. El objetivo es que las mallas trabajen conjuntamente y transmitan los esfuerzos entre ellas. En este caso, se traslapan de 25 a 35 centímetros de la malla", "museo/cimentacion_planta": "Esta planta muestra la distribución de la cimentación del proyecto, indicando la ubicación de las zapatas, las vigas de cimentación, las columnas y los muros de contención.", "museo/cimentacion_corte_placa": "Esta es la placa de cimentación, tiene un espesor de 20 centímetros y refuerzo de acero en la parte superior e inferior. También vemos las vigas de cimentación, que ayudan a transmitir las cargas al suelo. El recubrimiento indicado es de 2 centímetros y se utilizan distanciadores para mantener el acero en la posición correcta durante el vaciado del concreto.", "museo/cimentacion_detalle1": "Esta es la unión placa - viga de cimentación Las barras de acero dobladas, que permiten su anclaje dentro de la viga y contribuyen a que ambos elementos trabajen conjuntamente. Para la parte superior e inferior de la placa el recubrimiento es de 2 centímetros , y para los laterales de la viga mínimo 5 centímetros.", "museo/viga_despiece_cimentacion": "Al igual que en las columnas, los despieces de viga son el plano que permite identificar cómo se debe organizar el acero de refuerzo antes del vaciado del concreto. Aquí podemos observar la distribución de las barras longitudinales, que proporcionan resistencia a la flexión, y de los estribos, que ayudan a resistir el cortante y mantener el refuerzo en su posición. También las longitudes de los tramos y las separaciones de los estribos.", "museo/viga_despiece_cimentacion_2": "Al igual que en las columnas, los despieces de viga son el plano que permite identificar cómo se debe organizar el acero de refuerzo antes del vaciado del concreto. Aquí podemos observar la distribución de las barras longitudinales, que proporcionan resistencia a la flexión, y de los estribos, que ayudan a resistir el cortante y mantener el refuerzo en su posición. También las longitudes de los tramos y las separaciones de los estribos.", "museo/losa_corte_viga_cubierta": "En este plano observamos el corte típico de las placas aéreas, con espesor de 10 centímetros y una malla electrosoldada de 6 milímetros de diámetro, separada cada 15 centímetros. Los recubrimientos son de 2 centímetros y se usan distanciadores para mantener la malla en su posición durante el vaciado del concreto. Este detalle representa una riostra de concreto reforzado, un elemento estructural que conecta y amarra las zapatas, pilares o vigas para darles estabilidad y ayudar a distribuir las cargas. Tiene una sección de 10 × 50 cm, con dos barras longitudinales No. 3 y flejes No. 2 separados cada 20 cm. Además, cuenta con un traslapo mínimo de 80 cm para garantizar la continuidad del refuerzo.\"", "museo/acero_especificaciones_1": "Estas son especificaciones que indican cómo se debe colocar y distribuir el acero de refuerzo en las vigas de cimentación, incluyendo los anclajes, las barras adicionales y los flejes. También establecen el recubrimiento de concreto necesario para proteger el acero y evitar su deterioro.", "museo/acero_especificaciones_2": "Estas son especificaciones que indican cómo se debe colocar y distribuir el acero de refuerzo en las vigas de cimentación, incluyendo los anclajes, las barras adicionales y los flejes. También establecen el recubrimiento de concreto necesario para proteger el acero y evitar su deterioro.", "vivienda2/general_columnas_proyeccion_losa": "Muestra ubicación y dimensión de las columnas que conforman el sistema estructural de la edificación. La columnas cuentan con una sección de 30x30 y todas van desde la cimentación hasta la cubierta (CIM a CUB)", "vivienda2/general_columnas_cargas": "Muestra la distribución y ubicación de los elementos verticales que conforman el sistema estructural de la edificación. Las columnas se identifican con la nomenclatura C1.También se indican las dimensiones entre los diferentes ejes estructurales y las cargas axiales últimas (Pu) que recibe cada columna, expresadas en toneladas.", "vivienda2/columna_despiece": "La columna presenta una sección transversal de 0,30 × 0,30 m, con refuerzo longitudinal compuesto por 16 barras de acero No. 6. Los estribos están conformados por acero No. 3, con ganchos sísmicos de 135° y separación de entre 10 y 15 cm", "vivienda2/cimentacion_planta_zapatas": "Cada columna se encuentra sostenida por una zapata medianera con dimensiones de 1.00x 1.70 m y al fondo del eje 1 al 8 se encuentra una zapata combinada de 1.30 x 3.74 m", "vivienda2/cimentacion_cuadro_zapatas": "En el cuadro de zapatas se identifican dos tipologías: Zapata Z1 (medianera): presenta dimensiones de 1,70 m de largo, 1,00 m de ancho y 0,45 m de altura. Se contemplan 8 unidades. Zapata Z2 (combinada): presenta dimensiones de 3,74 m de largo, 1,30 m de ancho y 0,45 m de altura. Se contempla 1 unidad.", "vivienda2/cimentacion_corte_zapata": "Observamos el sistema de cimentación de la edificación que incluye acero de refuerzo dispuesto en ambas direcciones. También se contempla una viga de amarre de 0,30 × 0,40 m, encargada de vincular los elementos de cimentación. En la parte inferior se especifica un solado de concreto de 1500 PSI, con espesor de 5 cm, funcionando como capa de limpieza y superficie de apoyo de las zapatas.", "vivienda2/cimentacion_arranque_3d": "Observamos el sistema de cimentación de la edificación que incluye acero de refuerzo dispuesto en ambas direcciones. También se contempla una viga de amarre de 0,30 × 0,40 m, encargada de vincular los elementos de cimentación. En la parte inferior se especifica un solado de concreto de 1500 PSI, con espesor de 5 cm, funcionando como capa de limpieza y superficie de apoyo de las zapatas.", "vivienda2/viga_planta_cimiento": "Encontramos dos tipos de vigas de cimiento VCIM: son las vigas de cimentación que conectan a las zapatas y función principal es hacer que la estructura trabaje como un conjunto rígido y seguro frente a las cargas y movimientos del suelo VCIM MURO: son aquellas vigas que en particular tienen la función de soportar y transmitir la carga de un muro hacia el suelo o las zapatas.", "vivienda2/general_corte_longitudinal": "La estructura está conformada por zapatas de concreto reforzado apoyadas sobre una base de preparación del terreno, conectadas mediante pedestales y vigas de cimentación. En sentido vertical, se identifican columnas que conectan los diferentes niveles de la construcción. En sentido horizontal, se observan vigas y losas de concreto reforzado que conforman los entrepisos y la estructura de cubierta. La edificación presenta una altura aproximada de 5,40 m entre el nivel de piso y la cubierta, distribuida en dos niveles de 2,40 m de altura libre estructural, con elementos horizontales de 0,30 m de espesor.", "salud/cimentacion_planta": "En esta imagen podemos observar la cimentación del proyecto, compuesta por dos tipos de vigas de cimentación y tres tipos de zapatas. La viga de cimentación tipo 1 tiene una sección de 0,35 × 0,35 m, mientras que la viga de cimentación tipo 2 tiene una sección de 0,30 × 0,30 m. El sistema también cuenta con dos tipos de columnas y tres tipos de zapatas: la zapata tipo 1, de 1,00 × 1,00 m; la zapata tipo 2, de 1,20 × 1,20 m; y la zapata tipo 3, de 1,30 × 1,30 m. Todas las zapatas tienen una profundidad de 0,35 m.", "salud/cimentacion_cuadro_zapatas": "En este cuadro se presenta el armado de acero de los tres tipos de zapatas. La notación 5 #4, por ejemplo, indica que se utilizan 5 varillas de acero número 4; el primer número corresponde a la cantidad de varillas y el segundo identifica su diámetro. Este refuerzo se distribuye en dos direcciones: X y Y. Para la zapata Z1 se utilizan 5 varillas en cada dirección; para la Z2, 6 varillas; y para la Z3, 7 varillas, todas de número 4. Los detalles gráficos muestran la forma y las dimensiones de las barras de refuerzo: 0,85 m para la Z1, 1,05 m para la Z2 y 1,15 m para la Z3, con dobleces de 0,20 m en sus extremos.", "salud/columna_tipo1": "En este detalle se muestra el armado de la columna tipo 1, cuya sección mide 0,25 × 0,25 m y tiene una altura libre de 2,85 m. El refuerzo longitudinal está compuesto por 4 varillas de acero número 5, mientras que los estribos son de acero número 3, con una longitud de 0,90 m. La columna tiene un recubrimiento de concreto de 4 cm. Los estribos se distribuyen en tres zonas: en la parte superior se colocan 7 estribos número 3 cada 10 cm; en la zona central, 7 estribos número 3 cada 20 cm; y en la parte inferior, nuevamente 7 estribos número 3 cada 10 cm.", "salud/columna_tipo2": "En este detalle se muestra el armado de la columna tipo 2, que conserva las mismas dimensiones de la columna tipo 1, la principal diferencia está en el refuerzo longitudinal: esta columna cuenta con 8 varillas de acero número 5, el doble que la columna tipo 1. ¡Alto ahí! ¿Notaste algo diferente en esta columna? ¡Tiene el doble de varillas de acero que la columna tipo 1! Te explico: aunque ambas columnas tienen el mismo tamaño, no necesariamente soportan las mismas cargas. Algunas pueden necesitar más refuerzo porque deben resistir mayores esfuerzos estructurales. Por eso, en esta columna pasamos de 4 a 8 varillas de acero número 5. ¿Y por qué mantenemos el mismo diámetro? Porque el diseño estructural determina tanto la cantidad como el tamaño de las varillas que necesita cada columna.", "salud/viga_cimiento_1_y_2": "En este detalle se muestran los dos tipos de vigas de cimentación del proyecto. La viga tipo 1 tiene una sección de 0,35 × 0,35 m, un recubrimiento de concreto de 7,5 cm y cuatro varillas longitudinales de acero número 5. Sus estribos son de acero número 3, tienen una longitud de 1,00 m y se distribuyen cada 15 cm a lo largo de la viga. Por su parte, la viga tipo 2 tiene una sección de 0,30 × 0,30 m, conserva el mismo recubrimiento de 7,5 cm y cuenta con seis varillas longitudinales de acero número 4. Sus estribos también son de acero número 3, con una longitud de 0,80 m, y se ubican cada 15 cm a lo largo de toda la viga. En ambos tipos, los estribos tienen ganchos de 10 cm en sus extremos para favorecer su anclaje y mantener el refuerzo transversal en su posición.", "sauces/cimentacion_planta": "En esta planta de cimentación se identifican siete tipos de vigas de cimentación, todas con una sección de 0,25 × 0,25 m. Además, se observan cuatro tipos de zapatas, ubicadas a un nivel de -1,20 m respecto al nivel de referencia del proyecto.", "sauces/cimentacion_corte_tipo": "En este corte de cimentación se observa que la zapata tiene una altura de 0,30 m, seguida por la viga de cimentación de 0,25 m de altura. Sobre estos elementos se dispone una capa de relleno compactado de 0,55 m, hasta alcanzar la placa de contrapiso. En conjunto, estas dimensiones corresponden a una altura total de 1,20 m desde la base de la zapata hasta el nivel de la placa de contrapiso.", "sauces/cimentacion_refuerzo_zapatas": "En el cuadro de refuerzo de las zapatas se especifica la distribución del acero en dos direcciones: sentido A y sentido B. Por ejemplo, la expresión 8 #4 c/18 significa que se colocan 8 varillas de acero número 4, separadas cada 18 cm. El primer número indica la cantidad de varillas, el símbolo # identifica el número de la varilla y la medida después de “c/” indica la separación entre ellas. Este mismo criterio se aplica a las especificaciones de refuerzo en ambos sentidos.", "sauces/cimentacion_acero_zapata1": "En el corte de ubicación del acero de la zapata tipo 1 se observa que el refuerzo está compuesto por 8 barras de acero número 4 en cada dirección, separadas cada 18 cm. Además, se indica un recubrimiento de 8 cm.", "sauces/columna_despiece_tipos_1_2": "Como vimos previamente en el tutorial de la columna tipo 1, en este despiece se presentan 10 columnas con secciones de 30 × 30 cm. Cada una cuenta con 58 flejes de acero número 3, cuya longitud varía según el tramo entre el primer y el segundo piso. Se utilizan estribos cerrados y abiertos, distribuidos en la parte superior e inferior de la columna: seis flejes cada 10 cm en cada extremo y ocho flejes cada 20 cm en la zona central. Además, el refuerzo longitudinal está compuesto por ocho varillas: cuatro de acero número 5 y cuatro de acero número 4. En el despiece de la columna tipo 2 se identifica una unidad, con una sección de 35 × 35 cm. Su refuerzo longitudinal está compuesto por ocho varillas: dos de acero número 5 y seis de acero número 4. Además, cuenta con un estribo cerrado y dos estribos abiertos que se cruzan para formar una cruz. La distribución de los estribos a lo largo de la columna es la misma que en la columna tipo 1, con mayor concentración en los extremos y una separación más amplia en la zona central.", "sauces/viga_despiece_vc01": "La viga de cimentación tipo 1 tiene una sección de 25 × 25 cm y cuenta con seis varillas longitudinales: tres varillas número 5 en la parte superior y tres varillas número 4 en la parte inferior. Además, tiene 84 flejes de acero número 3, cada uno con una longitud de 0,56 m. Estos flejes se distribuyen a lo largo de la viga, con mayor concentración en los extremos, donde se ubican cada 6 cm, y una separación de 13 cm en la zona central, entre los flejes 21 y 23, según el despiece. Por último, las varillas longitudinales tienen traslapos para garantizar la continuidad del refuerzo: de 0,60 m en las varillas inferiores y de 0,95 m en las superiores.", "vivienda2/viga_despiece_c": "Las vigas presentan una sección transversal rectangular de 0,30 m de ancho por 0,30 m de altura, con longitudes variables que oscilan entre 3,34 m y 4,03 m. El refuerzo longitudinal está conformado por barras de acero corrugado No. 4, distribuidas en la parte superior e inferior de la viga, con cantidades y longitudes de acuerdo con cada tipo de viga.Adicionalmente, se dispone de refuerzo transversal mediante estribos No. 3, con separación de 10 cm en las zonas cercanas a los extremos y 12 cm en la zona central.", "vivienda2/viga_despiece_d": "Las vigas presentan una sección transversal rectangular de 0,30 m de ancho por 0,30 m de altura, con longitudes variables que oscilan entre 3,34 m y 4,03 m. El refuerzo longitudinal está conformado por barras de acero corrugado No. 4, distribuidas en la parte superior e inferior de la viga, con cantidades y longitudes de acuerdo con cada tipo de viga.Adicionalmente, se dispone de refuerzo transversal mediante estribos No. 3, con separación de 10 cm en las zonas cercanas a los extremos y 12 cm en la zona central.", "vivienda2/viga_despiece_e": "Las vigas presentan una sección transversal rectangular de 0,30 m de ancho por 0,30 m de altura, con longitudes variables que oscilan entre 3,34 m y 4,03 m. El refuerzo longitudinal está conformado por barras de acero corrugado No. 4, distribuidas en la parte superior e inferior de la viga, con cantidades y longitudes de acuerdo con cada tipo de viga.Adicionalmente, se dispone de refuerzo transversal mediante estribos No. 3, con separación de 10 cm en las zonas cercanas a los extremos y 12 cm en la zona central.", "vivienda2/viga_despiece_f": "Las vigas presentan una sección transversal rectangular de 0,30 m de ancho por 0,30 m de altura, con longitudes variables que oscilan entre 3,34 m y 4,03 m. El refuerzo longitudinal está conformado por barras de acero corrugado No. 4, distribuidas en la parte superior e inferior de la viga, con cantidades y longitudes de acuerdo con cada tipo de viga.Adicionalmente, se dispone de refuerzo transversal mediante estribos No. 3, con separación de 10 cm en las zonas cercanas a los extremos y 12 cm en la zona central."};

 };

 const NARR={
  museo:{t:'Guardiana del Museo de la Ciudad',n:'La ciudad se levantó a pulso, ladrillo a ladrillo, y tu encargo te llevó hasta la puerta de su museo en Ciudad Bolívar. Aquí un plano es un mapa del tesoro: la placa de cimentación reparte el peso, las columnas lo bajan y las vigas atan todo en un solo esqueleto. Con los planos que abriste, empezaste a ver cómo se sostiene un edificio.',c:'#c77f4f',nx:'Próxima parada: Sincelejo, una casa de dos pisos con balcón en voladizo.'},
  vivienda2:{t:'Maestra de Obra de Sincelejo',n:'Aquí no hay vitrinas: hay una casa de dos pisos que una familia soñó en Sincelejo. Su historia se lee de abajo hacia arriba: zapatas que se agarran al suelo, vigas de cimentación que las unen y columnas que suben hasta el balcón. Con los planos que abriste, pasaste de mirar una casa a leer cómo se construye.',c:'#e8a05a',nx:'Próxima parada: Moniquirá, un condominio con tanques de agua en la cubierta.'},
  sauces:{t:'Arquitecta del Condominio Los Sauces',n:'Moniquirá te recibió con un condominio donde cada casa repite el mismo orden: pórticos, losas y fachadas que se apoyan unas en otras. Repetir bien una estructura también es un arte, y hasta los tanques de agua de la cubierta descansan sobre una losa dibujada con cuidado. Los planos que abriste son tu llave para entenderla.',c:'#5fa8d8',nx:'Próxima parada: Sampués, un centro de salud de dos cuerpos con cubierta a dos aguas.'},
  salud:{t:'Guardiana del Centro de Salud',n:'Sampués necesitaba un lugar para cuidar a jóvenes, y tu encargo fue entender su edificio: dos cuerpos unidos bajo cubiertas a dos aguas. Cuidar también es construir bien: pórticos firmes, columnas continuas y cada plano como un manual de instrucciones. Los planos que abriste ya te dejaron leer una parte de ese manual.',c:'#d86f6f',nx:'Última parada completada: ya recorriste las cuatro misiones.'}};
 const SKILL={zapatas:'Lectura de cimentación: ubicar zapatas o placa, sus medidas y su refuerzo.',columnas:'Lectura de columnas: sección, barras longitudinales y estribos.',vigas:'Lectura de vigas: referencia, sección, barras y estribos.',nudos:'Lectura de nudos: cómo se une y se confina el encuentro viga-columna.',losas:'Lectura de losas: paños, vigas de apoyo y cortes.',acero:'Lectura de acero: despiece, traslapos, ganchos y doblados.',muros:'Fachada y conjunto: relacionar la imagen del proyecto con la estructura que la sostiene.'};
 const planTitle=(p,key)=>{for(const l of Object.values(CR[p]))for(const e of l)if(p+'/'+e[0]===key)return e[1];return key};
 function badge(n,c){const r=(x,y,w,h,f)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${f}"/>`;return `<svg class="bd" viewBox="0 0 14 16" aria-hidden="true">${r(1,0,12,1,'#20203b')}${r(0,1,14,9,'#20203b')}${r(1,10,12,2,'#20203b')}${r(3,12,8,2,'#20203b')}${r(5,14,4,2,'#20203b')}${r(1,1,12,9,c)}${r(2,10,10,1,c)}${r(3,11,8,1,c)}${r(4,12,6,1,c)}${r(5,13,4,1,c)}${r(2,2,10,1,'#ffffff55')}<text x="7" y="9" text-anchor="middle" font-size="8" font-weight="900" font-family="Nunito,sans-serif" fill="#20203b">${n}</text></svg>`}
 function confetti(){if(RM)return;const cf=$('#cf');if(!cf)return;const C=['#ffd35a','#ff8fb8','#7954cc','#6fd27f','#8ecbe8'];for(let i=0;i<46;i++){const e=mk('i');e.style.cssText=`left:${Math.random()*100}%;background:${C[i%5]};animation-duration:${2+Math.random()*1.6}s;animation-delay:${Math.random()*.9}s`;cf.append(e)}}
 function showReward(p){const k=ORD.indexOf(p),i=k+2,N=NARR[p],f=$('#fin');if(!f||f.classList.contains('open')&&f.dataset.r===p)return;ffocus=ffocus||document.activeElement;
  const cats=CATS.filter(c=>st.cats[p][c]),keys=Object.keys(st.plans[p]),nA=Object.keys(st.ann).filter(a=>a.startsWith('p:'+p+'/')).length,nxt=ORD[k+1];
  const path=ORD.map((q,x)=>`<div class="nd ${st.done[x+2]?'done':''} ${q===p?'cur':''}">${x+1}</div>`).join('<div class="ln"></div>');
  f.dataset.r=p;f.innerHTML=`<div class="box"><div class="cf" id="cf"></div><div class="hd" style="background:linear-gradient(90deg,${N.c}55,#d8c7ff)">${badge(k+1,N.c)}<div><div class="lg2" style="margin:0">¡Logro desbloqueado! · Misión ${k+1} de 4</div><h2 id="fint">${esc(N.t)}</h2><small>${esc(SHORT[p])} · Estrella ${i} conseguida</small></div></div>
  <p class="msg" style="margin-top:12px">${esc(N.n)}</p>
  <div class="cols"><div><h4>Habilidades desbloqueadas</h4><ul class="ck">${cats.map(c=>`<li>${esc(SKILL[c])}</li>`).join('')||'<li>Lectura general de planos.</li>'}</ul></div>
  <div><h4>Tu bitácora de hallazgos</h4><ul>${keys.map(q=>`<li>${esc(planTitle(p,q))}</li>`).join('')}</ul><p class="ft" style="margin:6px 0 0;font-size:.8rem;font-weight:800">${keys.length} ${keys.length===1?'plano visto':'planos distintos vistos'} · ${nA} ${nA===1?'anotación leída':'anotaciones leídas'} en este proyecto</p></div></div>
  <div class="rw">${badge(k+1,N.c)}<div><b>Insignia «${esc(LABEL[p])}»</b> y estrella ${i} en tu barra. Cada una la ganaste explorando, no por casualidad.</div></div>
  <div class="path">${path}</div><p class="nx">${esc(N.nx)}</p>
  <div class="ft"><button class="pxb" id="fcn" type="button">Seguir explorando</button>${nxt?`<button class="pxb" id="fnx" type="button" style="background:var(--y)">Ir a la misión ${k+2}: ${esc(LABEL[nxt])} →</button>`:`<button class="pxb" id="fnx" type="button" style="background:var(--y)">${pendFinal?'Ver mi cierre ★':'Elegir otra misión'}</button>`}</div></div>`;
  f.classList.add('open');$('#fcn').focus();confetti();
  const done=()=>{const pf=pendFinal;pendFinal=false;closeFinal();if(pf)setTimeout(()=>showFinal(true),400)};
  $('#fcn').onclick=done;
  $('#fnx').onclick=()=>{const pf=pendFinal;pendFinal=false;closeFinal();const m=$('#mcl');if($('#ov').classList.contains('open')&&m)m.click();if(nxt){setProj(nxt);api.enter(nxt)}if(pf)setTimeout(()=>showFinal(true),400)}}
 /* pantalla final */
 let ffocus=null;
 function showFinal(cel){const f=$('#fin'),pls=ORD.map(p=>plN(p));ffocus=document.activeElement;
  f.dataset.r='';f.innerHTML=`<div class="box"><div class="cf" id="cf"></div><div class="hd"><img id="fi1" alt="Malu"><img id="fi2" alt="Laury"><div><h2 id="fint">¡Misión cumplida! Ya sabes leer un sistema aporticado</h2><small>Laury y Malu · Misión de sistemas aporticados</small></div></div>
  <div class="big">${SV.repeat(5)}</div>
  <div class="cols"><div><h4>Objetivos completados</h4><ul class="ck"><li><b>Explorador de anotaciones:</b> ${annN()} anotaciones únicas consultadas de ${ANN.length} (la meta era ${NEED}).</li>${ORD.map((p,i)=>`<li><b>Proyecto ${i+1} · ${esc(SHORT[p])}:</b> ${pls[i]} ${pls[i]===1?'plano distinto visto':'planos distintos vistos'}.</li>`).join('')}</ul></div>
  <div><h4>Lo que te llevas</h4><ul><li>Un <b>sistema aporticado</b> es un esqueleto de pórticos de concreto reforzado: columnas y vigas que trabajan unidas.</li><li>La carga baja por un camino: <b>losa → vigas → columnas → cimentación → suelo</b>.</li><li>El <b>nudo viga-columna</b> debe estar bien anclado y confinado para que el pórtico actúe como un conjunto.</li><li>Los <b>muros</b> cierran el edificio, pero no son la estructura principal.</li><li>En los <b>planos</b> se leen ejes, niveles, cortes y despieces; las <b>anotaciones</b> dan cantidad de varillas, diámetro (#), longitud (L=), separación de estribos (c/) y ganchos de 135°.</li></ul></div></div>
  <p class="msg"><b>Malu y Laury:</b> comparaste un museo, un edificio de salud y dos viviendas, con placas y zapatas distintas, pero con la misma lógica: cada elemento tiene una función y cada plano lo explica. ¡Ahora puedes leer cualquier despiece con confianza!</p>
  <div class="ft"><button class="pxb" id="fcn" type="button">Seguir explorando</button><button class="pxb" id="fmn" type="button" style="background:var(--y)">← Volver al menú</button></div></div>`;
  $('#fi1').src=IMG.malu_boca_abierta;$('#fi2').src=IMG.laury_boca_abierta;f.classList.add('open');$('#fcn').focus();
  $('#fcn').onclick=closeFinal;$('#fmn').onclick=()=>{closeFinal();goMenu()};
  if(cel&&!RM){const cf=$('#cf'),C=['#ffd35a','#ff8fb8','#7954cc','#6fd27f','#8ecbe8'];for(let i=0;i<46;i++){const e=mk('i');e.style.cssText=`left:${Math.random()*100}%;background:${C[i%5]};animation-duration:${2+Math.random()*1.6}s;animation-delay:${Math.random()*.9}s`;cf.append(e)}}}
 function closeFinal(){const f=$('#fin');if(!f.classList.contains('open'))return;f.classList.remove('open');f.innerHTML='';if(ffocus&&ffocus.focus)ffocus.focus()}
 addEventListener('keydown',e=>{if(e.key!=='Escape')return;if($('#fin').classList.contains('open')){closeFinal();e.stopImmediatePropagation();return}if(!$('#spn').hidden){togglePanel(false);e.stopImmediatePropagation()}},true);
 /* menú */
 function goMenu(){save();try{if(parent!==window){parent.postMessage({tipo:'mision-malu-laury:menu'},'*');return}}catch(e){}
  const u=new URLSearchParams(location.search).get('menu')||'Juego.html';
  if(location.protocol==='file:'){location.href=u;return}
  fetch(u,{method:'HEAD'}).then(r=>{if(r.ok)location.href=u;else throw 0}).catch(()=>toast('<div>No encuentro la pantalla de selección de personajes («'+esc(u)+'») junto a esta misión.<small>Tu progreso está guardado. Ponla en la misma carpeta o usa ?menu=ruta en la dirección.</small></div>','info',6500))}
 $('#mnu').onclick=goMenu;
 /* música de fondo (sintetizada, sin archivos) */
 const MU=(()=>{let ac=null,out=null,tm=null,nt=0,sp=0;const CH=[[130.81,[261.63,329.63,392,523.25]],[110,[220,261.63,329.63,440]],[87.31,[174.61,220,261.63,349.23]],[98,[196,246.94,293.66,392]]],EI=.3;
  const tone=(f,t,d,ty,v)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(out);o.start(t);o.stop(t+d+.05)};
  const sched=()=>{while(nt<ac.currentTime+.5){const bar=Math.floor(sp/8)%4,k=sp%8,[b,n]=CH[bar];if(k===0||k===4)tone(b,nt,EI*3.2,'square',.05);tone(n[[0,1,2,3,2,1,3,2][k]]*(k===7?2:1),nt,EI*1.8,'triangle',.08);nt+=EI;sp++}};
  return{ok:()=>!!ac,start(){try{if(!ac){const C=window.AudioContext||window.webkitAudioContext;if(!C)return false;ac=new C();out=ac.createGain();out.gain.value=.5;out.connect(ac.destination)}ac.resume();if(!tm){nt=ac.currentTime+.05;tm=setInterval(sched,120);sched()}return true}catch(e){return false}},
   stop(){clearInterval(tm);tm=null;if(ac)ac.suspend()}}})();
 let armed=false;
 function musUI(){const on=!!st.music;$('#mus').setAttribute('aria-pressed',String(on));$('#mst').textContent=on?'ON':'OFF';$('#mus').title=on?'Música encendida: pulsa para apagarla':'Música apagada: pulsa para encenderla'}
 function arm(){if(armed)return;armed=true;const go=()=>{removeEventListener('pointerdown',go,true);removeEventListener('keydown',go,true);armed=false;if(st.music)MU.start()};addEventListener('pointerdown',go,true);addEventListener('keydown',go,true)}
 $('#mus').onclick=e=>{e.stopPropagation();st.music=st.music?0:1;save();musUI();if(st.music){if(!MU.start())arm()}else MU.stop()};
 document.addEventListener('visibilitychange',()=>{if(document.hidden)MU.stop();else if(st.music&&MU.ok())MU.start()});
 musUI();if(st.music)arm();api.hydrate();

function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;fr++;requestAnimationFrame(frame);if(document.hidden||$('#ov').classList.contains('open'))return;
 if(!drag){yaw+=vel*dt;vel*=Math.pow(.02,dt)}if(auto&&!drag&&Math.abs(vel)<.05)yaw+=dt*.3;const g=GEN[proj],L=[];

 SKY(cx,W,H);hits=[];const S=Math.min(W/(2*g.R*1.08+1.4),H/(.88*g.Yt+.96*g.R+1.2))*zoom;draw3D(cx,W,H,L,yaw,pitch,S,H*.56,g.Yt/2,hits,hi);
 for(const k in eb){eb[k].b.classList.toggle('on',!!sel&&sel.k===k);drawEl(k,now/1000)}
 if(fr%3===0)drawThumb(proj,yaw)}
Object.keys(PR).forEach(k=>drawThumb(k,.8));
setStage(5,false);setProj(PG.last());requestAnimationFrame(frame);
})();
