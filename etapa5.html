<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="assets/css/pc-common.css"><script src="assets/js/pc-common.js"></script>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laura · Etapa 5: Vigas, nudos y placas de entrepiso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--b950:#0a2152;--b900:#0e2f6e;--b800:#123a85;--b700:#1c4fa8;--b600:#1f5bbf;--b400:#5b9bea;--b200:#bcd8fa;--b100:#e8f2fe;
 --px:'Press Start 2P','Courier New',monospace;--tx:'Trebuchet MS','Segoe UI',Arial,sans-serif;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{font-family:var(--tx);color:#fff;background:#0a2152;display:grid;grid-template-rows:auto clamp(150px,27vh,240px) minmax(0,1fr);gap:10px;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));overflow:hidden}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.bt{font:10px var(--px);padding:11px 14px;background:var(--b100);color:var(--b950);border:3px solid var(--b950);box-shadow:0 0 0 2px var(--b400),3px 3px 0 2px var(--b950)}
.bt:hover{background:#fff}.bt:active{transform:translate(2px,2px)}
.bar{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px)) 0 0;flex-wrap:wrap}
.ttl{flex:1;min-width:200px;background:var(--b950);border:3px solid var(--b700);padding:12px 14px;font:11px/1.4 var(--px);color:var(--b100)}
.ttl b{color:#fff}
.prog{font:10px var(--px);color:var(--b200);background:var(--b950);border:3px solid var(--b700);padding:12px 14px}
.strip{position:relative;display:flex;align-items:center;gap:26px;overflow:hidden;border:4px solid var(--b950);box-shadow:0 0 0 3px var(--b400)}
#sky{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.laura{position:relative;flex:none;height:100%;aspect-ratio:472/392;align-self:flex-end;margin-left:2%}
.laura img{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
#imgA{visibility:hidden}
.bubble{position:relative;flex:1;margin-right:18px;background:#f3f8ff;color:var(--b900);border:4px solid var(--b950);box-shadow:5px 5px 0 var(--b950);padding:14px 18px;font-size:clamp(15px,1.5vw,20px);font-weight:700;line-height:1.45;min-height:70px;cursor:pointer}
.bubble::before{content:"";position:absolute;left:-22px;top:50%;margin-top:-12px;border:12px solid transparent;border-right:18px solid var(--b950);border-left:0}
.bubble::after{content:"";position:absolute;left:-14px;top:50%;margin-top:-8px;border:8px solid transparent;border-right:12px solid #f3f8ff;border-left:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
main{display:grid;grid-template-columns:minmax(210px,22%) 1fr minmax(260px,26%);gap:12px;min-height:0}
.steps,.side{background:var(--b800);border:4px solid var(--b950);box-shadow:0 0 0 3px var(--b400);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:0}
.steps h3{margin:0;padding:10px;background:var(--b950);font:10px/1.5 var(--px);color:var(--b100)}
#cards{flex:1;display:grid;grid-template-rows:repeat(6,minmax(46px,1fr));gap:7px;min-height:0}
.card{display:flex;align-items:center;gap:10px;text-align:left;padding:4px 10px;background:var(--b200);color:var(--b950);border:3px solid var(--b950);font-size:14px;font-weight:700;line-height:1.15;transition:transform .15s}
.card svg{flex:none;width:40px;height:40px}
.card:hover{transform:translateX(3px)}
.card[aria-pressed=true]{background:var(--b600);color:#fff;box-shadow:0 0 0 3px #fff}
.view{position:relative;min-height:0;border:4px solid var(--b950);box-shadow:0 0 0 3px var(--b400);background:radial-gradient(circle at 50% 38%,#2a66c4,#0d2d6b 75%);touch-action:none;cursor:grab;overflow:hidden}
.view:active{cursor:grabbing}
.view canvas{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
.hint{position:absolute;left:12px;bottom:10px;font-size:13px;color:var(--b200);pointer-events:none}
.ctl{position:absolute;right:10px;top:10px;display:flex;gap:8px}
.ctl .bt{font-size:8px;padding:8px 9px}
.blk{background:var(--b100);color:var(--b950);border:3px solid var(--b950);padding:10px 12px}
.blk h4{margin:0 0 6px;font:10px/1.5 var(--px);color:var(--b700)}
.blk p{margin:0;font-size:14px;line-height:1.45}
.blk ul{margin:0;padding:0 0 0 4px;list-style:none;display:flex;flex-direction:column;gap:5px}
.blk li{font-size:14px;line-height:1.35;padding-left:14px;position:relative}
.blk li::before{content:"";position:absolute;left:0;top:.5em;width:7px;height:7px;background:var(--b700)}
.side{overflow:auto}
#go{margin-top:auto;font-size:13px;padding:16px;background:var(--b700);color:#fff;border-color:var(--b950)}
#go:hover{background:var(--b600)}
#go.rdy{animation:pul 1.1s steps(2) infinite}
@keyframes pul{50%{box-shadow:0 0 0 2px #fff,3px 3px 0 2px var(--b950)}}
@media(max-width:980px){
 body{display:flex;flex-direction:column;height:auto;min-height:100%;overflow:auto}
 .strip{height:190px;flex:none}.bubble{font-size:14px;margin-right:10px}.laura{margin-left:0}
 main{display:flex;flex-direction:column}
 #cards{grid-template-rows:none;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
 .view{height:380px;flex:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

  g.add(rod(V(-1.25,beamBottom+.2,-.72),V(1.25,beamBottom+.2,-.72),.035,pipe),rod(V(.58,beamBottom+.22,-1.25),V(.58,beamBottom+.22,1.25),.035,pipe));
  g.add(box(.2,.08,.2,pipe,-.65,beamBottom+.21,.55),box(.2,.08,.2,pipe,1.02,beamBottom+.21,-.22));
 };
 if(n===1){beamSoffits();beamSides();beamShoring();}
 if(n===2){beamSoffits();beamSides();beamShoring();beamRebar();}
 if(n===3){beamConcrete();}
 if(n===4){beamConcrete();slabForm();slabMesh();}
 if(n===5){beamConcrete();slabForm();slabMesh();pipes();}
 if(n===6){beamConcrete();g.add(box(2.92,.38,2.92,slab,0,slabY,0));}
 return g;
}
/* ---------- Visor ---------- */
const view=$('view');
let renderer,scene,camera,pivot,cur=null,az=.6,el=.34,dragging=false,auto=true,raf=0,t0=performance.now();
const Q=.6; /* resolución interna: da el pixelado moderado */
function fit(){const w=view.clientWidth,h=view.clientHeight;if(!w||!h)return;renderer.setSize(Math.round(w*Q),Math.round(h*Q),false);camera.aspect=w/h;camera.updateProjectionMatrix();}
function place(){const d=11.2*Math.max(1,.95/camera.aspect);camera.position.set(0,2.8+Math.sin(el)*d,Math.cos(el)*d);camera.lookAt(0,2.7,0);}
function loop(now){
 raf=requestAnimationFrame(loop);
 if(auto&&!dragging&&!reduce)az+=.004;
 pivot.rotation.y=az;place();
 if(cur){
  if(cur.scale.x<1)cur.scale.setScalar(Math.min(1,cur.scale.x+.05));
  if(cur.userData.tick)cur.userData.tick(now-t0);
  if(cur.userData.done&&cur.scale.x>=1){const d=cur.userData.done;cur.userData.done=null;d();}
 }
 renderer.render(scene,camera);
}
function clear(){while(pivot.children.length){const c=pivot.children.pop();c.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material)o.material.dispose();});}cur=null;}
try{
 renderer=new T.WebGLRenderer({antialias:false,alpha:true});renderer.setPixelRatio(1);
 view.insertBefore(renderer.domElement,view.firstChild);
 scene=new T.Scene();camera=new T.PerspectiveCamera(38,1,.1,100);pivot=new T.Group();scene.add(pivot);
 scene.add(new T.AmbientLight(0xffffff,.78));
 const dl=new T.DirectionalLight(0xffffff,.8);dl.position.set(4,9,6);scene.add(dl);
 const fl=new T.DirectionalLight(0xbcd8fa,.3);fl.position.set(-6,3,-4);scene.add(fl);
 new ResizeObserver(fit).observe(view);fit();
 let lx=0,ly=0;
 view.addEventListener('pointerdown',e=>{if(e.target.closest('.ctl'))return;dragging=true;lx=e.clientX;ly=e.clientY;view.setPointerCapture(e.pointerId);});
 view.addEventListener('pointermove',e=>{if(!dragging)return;az+=(e.clientX-lx)*.01;el=Math.max(.05,Math.min(.75,el+(e.clientY-ly)*.004));lx=e.clientX;ly=e.clientY;});
 const up=()=>{dragging=false;};view.addEventListener('pointerup',up);view.addEventListener('pointercancel',up);
 raf=requestAnimationFrame(loop);
}catch(err){pivot=null;view.insertAdjacentHTML('beforeend','<p style="padding:20px">No se pudo iniciar la vista 3D en este navegador.</p>');}
/* ---------- Un solo mecanismo: paso → tarjeta, modelo, panel, progreso ---------- */
const cardsEl=$('cards'),tipsEl=$('tips');
STEPS.forEach((s,i)=>{const b=document.createElement('button');b.className='card';b.setAttribute('aria-pressed','false');
 b.innerHTML=ICONS[i]+'<span>'+(i+1)+'. '+s.n+'</span>';b.onclick=()=>present(i+1);cardsEl.appendChild(b);});
function show(n,count){
 const s=STEPS[n-1];state.step=n;if(count)state.seen.add(n);
 [...cardsEl.children].forEach((c,i)=>c.setAttribute('aria-pressed',String(i+1===n)));
 $('sh').textContent='PASO '+n+' · '+s.n.toUpperCase();$('sd').textContent=s.d;
 tipsEl.innerHTML='';s.tips.forEach(t=>{const li=document.createElement('li');li.textContent=t;tipsEl.appendChild(li);});
 $('an').textContent=s.a||ANOT;
 $('prog').textContent=state.seen.size+'/6 PASOS · '+state.seen.size*10+' XP';
 $('go').classList.toggle('rdy',state.seen.size===6);
 view.setAttribute('aria-label','Modelo 3D: '+s.n);
 if(!pivot)return Promise.resolve();
 clear();cur=build(n);cur.scale.setScalar(reduce?1:.88);pivot.add(cur);
 return new Promise(r=>{cur.userData.done=r;});
}
async function present(n){
 cancel();const id=run;await show(n,true);if(id!==run)return;
 const parts=STEPS[n-1].s;
 for(let i=0;i<parts.length;i++){if(!(await speak(parts[i],id)))return;if(i<parts.length-1&&!(await wait(READ)))return;}
 if(!state.guided||n>=6)return;
 if(!(await wait(READ))||!state.guided||id!==run)return;
 present(n+1);
}
async function start(){
 cancel();const id=run;state.seen.clear();await show(1,false);if(id!==run)return;
 if(!(await speak(INTRO,id)))return;
 if(!state.guided)return;
 if(!(await wait(READ))||!state.guided||id!==run)return;
 present(1);
}
/* ---------- Controles ---------- */
$('rot').onclick=function(){auto=!auto;this.setAttribute('aria-pressed',String(auto));this.textContent=auto?'Pausar giro':'Girar';};
$('guide').onclick=function(){
 state.guided=!state.guided;this.setAttribute('aria-pressed',String(state.guided));this.textContent=state.guided?'Guía: sí':'Guía: no';
 if(state.guided&&!talking&&!pend.length&&state.step<6)present(state.seen.has(state.step)?state.step+1:state.step);
};
$('reset').onclick=()=>{state.guided=true;$('guide').setAttribute('aria-pressed','true');$('guide').textContent='Guía: sí';start();};
/* Navegación: las secciones destino no están definidas en este archivo; se emiten eventos para conectarlas. */
const nav=(name,fn)=>{if(typeof window[fn]==='function')return window[fn]();if(name==='laura:continuar'){try{const x=JSON.parse(localStorage.getItem('pcLaura')||'{}');x.completed=x.completed||[];if(!x.completed.includes(5))x.completed.push(5);localStorage.setItem('pcLaura',JSON.stringify(x));}catch(e){} location.href='etapa6-7.html'; return;}if(name==='laura:menu'){(sessionStorage.setItem('pcArqReturn','1'),location.href='Juego.html');return;}window.dispatchEvent(new CustomEvent(name));try{parent.postMessage({type:name},'*');}catch(e){}};
$('go').onclick=()=>nav('laura:continuar','onLauraContinuar');
$('menu').onclick=()=>nav('laura:menu','onLauraMenu');
new ResizeObserver(city).observe($('sky').parentElement);city();
addEventListener('pagehide',()=>{cancelAnimationFrame(raf);cancel();});
start();
})();

<script>/* Sonido retro común: se activa tras interacción del usuario */(function(){if(window.pcSharedSound)return;var C=window.AudioContext||window.webkitAudioContext,ctx=null,enabled=true;function tone(freq,dur){if(!C||!enabled)return;try{ctx=ctx||new C();if(ctx.state==='suspended')ctx.resume();var o=ctx.createOscillator(),g=ctx.createGain();o.type='square';o.frequency.setValueAtTime(freq,ctx.currentTime);g.gain.setValueAtTime(.025,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+dur);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+dur)}catch(e){}}window.pcSharedSound={tone:tone};document.addEventListener('click',function(e){var b=e.target.closest('button,a,[role=button]');if(!b||b.id==='mute'||b.id==='skipIntro')return;tone(b.matches('.pj,.card')?660:440,.055)},true);})();</script>
